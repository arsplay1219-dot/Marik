<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МОЙ КАНАЛ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* ============ НАСТРОЙКИ — ПРАВЬ ЗДЕСЬ ============ */
  /* 1) Вставь сюда свой Google OAuth Client ID (см. инструкцию в чате) */
  /* 2) Вставь свою почту в ALLOWED_EMAIL ниже, в <script> в конце файла */

  :root{
    --bg: #0a0d12;
    --bg-soft: #10141b;
    --panel: #141922;
    --line: #232a35;
    --text: #e8ecf1;
    --muted: #7c8798;
    --amber: #ff7a1a;
    --teal: #2dd4bf;
    --red: #ff4d4d;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% -10%, #131a24 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ============ ЭКРАН ВХОДА ============ */
  #loginScreen{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:40px 32px 32px;
    text-align:center;
    position:relative;
  }
  .login-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--amber), var(--red), var(--amber));
  }
  .on-air{
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.12em;
    color:var(--muted); margin-bottom:22px;
  }
  .on-air .dot{width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red);}
  .login-card h1{
    font-family:var(--font-display);
    font-size:44px; line-height:1;
    letter-spacing:.02em;
    margin-bottom:8px;
  }
  .login-card p{
    color:var(--muted); font-size:14px; margin-bottom:28px;
  }
  #gBtnWrap{display:flex; justify-content:center; margin-bottom:16px;}
  .login-msg{
    font-family:var(--font-mono); font-size:12px; margin-top:16px; min-height:16px;
  }
  .login-msg.err{color:var(--red);}
  .login-msg.ok{color:var(--teal);}

  /* ============ ЭКРАН КАНАЛА ============ */
  #appScreen{display:none; flex:1; flex-direction:column;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:var(--bg-soft);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:10px; height:10px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 10px var(--amber);
  }
  .brand-name{font-family:var(--font-display); font-size:24px; letter-spacing:.03em;}
  .header-right{display:flex; align-items:center; gap:16px;}
  #clock{font-family:var(--font-mono); font-size:13px; color:var(--muted);}
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--text);
    font-family:var(--font-body); font-size:13px; padding:8px 14px;
    border-radius:3px; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .icon-btn:hover{border-color:var(--amber); color:var(--amber);}

  main{
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:32px 20px 48px; gap:28px;
  }

  /* ТВ-рамка: маленькая по умолчанию, растягивается в fullscreen */
  #tvFrame{
    width:420px; max-width:100%;
    background:#000;
    border:10px solid #1a1f28;
    border-radius:6px;
    box-shadow:0 0 0 1px #000, 0 30px 60px -20px rgba(0,0,0,.7);
    transition:width .25s ease;
  }
  #tvFrame:fullscreen, #tvFrame:-webkit-full-screen{
    width:100vw; height:100vh; border:0; border-radius:0;
    display:flex; align-items:center; justify-content:center;
  }
  #tvFrame:fullscreen .screen-wrap, #tvFrame:-webkit-full-screen .screen-wrap{
    height:100vh;
  }
  .screen-wrap{position:relative; width:100%; aspect-ratio:16/9; background:#000;}
  .screen-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .screen-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:var(--muted); font-family:var(--font-mono); font-size:12px;
  }

  .controls-row{display:flex; gap:10px; align-items:center;}
  #fullscreenBtn{
    display:flex; align-items:center; gap:8px;
    background:var(--amber); color:#1a0d00; border:none;
    font-family:var(--font-body); font-weight:700; font-size:14px;
    padding:11px 20px; border-radius:3px; cursor:pointer;
    transition:filter .15s;
  }
  #fullscreenBtn:hover{filter:brightness(1.1);}

  /* Программа передач */
  #guide{width:100%; max-width:720px;}
  #guide h2{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.1em;
    color:var(--muted); margin-bottom:12px; text-transform:uppercase;
  }
  .show-row{
    display:flex; align-items:center; gap:14px;
    padding:13px 14px; border:1px solid var(--line); border-radius:3px;
    margin-bottom:8px; cursor:pointer; background:var(--panel);
    transition:border-color .15s, background .15s;
  }
  .show-row:hover{border-color:var(--teal);}
  .show-row.active{border-color:var(--amber); background:#1a1410;}
  .show-tag{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.06em;
    padding:4px 8px; border-radius:2px; white-space:nowrap;
  }
  .show-tag.cartoon{background:rgba(45,212,191,.15); color:var(--teal);}
  .show-tag.news{background:rgba(255,122,26,.15); color:var(--amber);}
  .show-title{font-size:14px; flex:1;}
  .show-time{font-family:var(--font-mono); font-size:12px; color:var(--muted);}

  @media (max-width:480px){
    header{padding:12px 16px;}
    #clock{display:none;}
    main{padding:24px 14px 36px;}
    #tvFrame{border-width:6px;}
  }
</style>
</head>
<body>

  <!-- ============ ЭКРАН ВХОДА ============ -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="on-air"><span class="dot"></span>ЛИЧНЫЙ КАНАЛ</div>
      <h1>МОЙ КАНАЛ</h1>
      <p>Вход только для владельца канала</p>
      <div id="gBtnWrap"></div>
      <div class="login-msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- ============ ЭКРАН КАНАЛА (после входа) ============ -->
  <div id="appScreen">
    <header>
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">МОЙ КАНАЛ</span>
      </div>
      <div class="header-right">
        <span id="clock">--:--:--</span>
        <button class="icon-btn" id="logoutBtn">Выйти</button>
      </div>
    </header>

    <main>
      <div id="tvFrame">
        <div class="screen-wrap">
          <div class="screen-placeholder" id="placeholder">
            <span>▶ ВЫБЕРИ ПЕРЕДАЧУ СНИЗУ</span>
          </div>
          <iframe id="player" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      </div>

      <div class="controls-row">
        <button id="fullscreenBtn">⛶ На весь экран</button>
      </div>

      <div id="guide">
        <h2>Программа передач</h2>
        <div id="showList"></div>
      </div>
    </main>
  </div>

<script>
/* ================= НАСТРОЙКИ ДОСТУПА ================= */
const GOOGLE_CLIENT_ID = "73012247148-8cpgfqe7igqa6ro99eoia6jdjmus9lnf.apps.googleusercontent.com";
const ALLOWED_EMAIL = "arsplay1219@gmail.com";

/* ================= СПИСОК ПЕРЕДАЧ =================
   embed — это адрес для <iframe>. Проще всего взять с YouTube:
   открой видео → Поделиться → Встроить → скопируй ссылку из src="...".
   Можно так же поставить ссылку на прямой эфир (live) канала. */
const shows = [
  { tag:"cartoon", tagLabel:"МУЛЬТФИЛЬМ", title:"Мультфильм №1", time:"10:00", embed:"https://www.youtube.com/embed/dQw4w9WgXcQ" },
  { tag:"cartoon", tagLabel:"МУЛЬТФИЛЬМ", title:"Мультфильм №2", time:"10:30", embed:"https://www.youtube.com/embed/dQw4w9WgXcQ" },
  { tag:"news",    tagLabel:"НОВОСТИ",    title:"Новости дня",   time:"11:00", embed:"https://www.youtube.com/embed/dQw4w9WgXcQ" },
];

/* ================= ВХОД ЧЕРЕЗ GOOGLE ================= */
function decodeJwt(token){
  const payload = token.split(".")[1];
  return JSON.parse(decodeURIComponent(atob(payload.replace(/-/g,"+").replace(/_/g,"/"))
    .split("").map(c => "%" + ("00"+c.charCodeAt(0).toString(16)).slice(-2)).join("")));
}

function handleCredentialResponse(response){
  const data = decodeJwt(response.credential);
  const msg = document.getElementById("loginMsg");
  if (data.email && data.email.toLowerCase() === ALLOWED_EMAIL.toLowerCase() && data.email_verified){
    sessionStorage.setItem("channelAuth", data.email);
    msg.textContent = "";
    showApp();
  } else {
    msg.textContent = "Доступ запрещён — это личный канал.";
    msg.className = "login-msg err";
  }
}

window.addEventListener("load", () => {
  if (window.google && GOOGLE_CLIENT_ID.indexOf("ВСТАВЬ") === -1){
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(document.getElementById("gBtnWrap"), {
      theme:"filled_black", size:"large", shape:"pill", text:"signin_with"
    });
  } else {
    document.getElementById("loginMsg").textContent = "Сначала настрой GOOGLE_CLIENT_ID в коде.";
    document.getElementById("loginMsg").className = "login-msg err";
  }

  if (sessionStorage.getItem("channelAuth") === ALLOWED_EMAIL){
    showApp();
  }
});

function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appScreen").style.display = "flex";
  buildGuide();
  tickClock();
  setInterval(tickClock, 1000);
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem("channelAuth");
  location.reload();
});

function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("ru-RU");
}

/* ================= ПРОГРАММА ПЕРЕДАЧ ================= */
function buildGuide(){
  const list = document.getElementById("showList");
  shows.forEach((show, i) => {
    const row = document.createElement("div");
    row.className = "show-row";
    row.innerHTML = `
      <span class="show-tag ${show.tag}">${show.tagLabel}</span>
      <span class="show-title">${show.title}</span>
      <span class="show-time">${show.time}</span>`;
    row.addEventListener("click", () => playShow(i, row));
    list.appendChild(row);
  });
}

function playShow(i, row){
  document.querySelectorAll(".show-row").forEach(r => r.classList.remove("active"));
  row.classList.add("active");
  const player = document.getElementById("player");
  document.getElementById("placeholder").style.display = "none";
  player.style.display = "block";
  player.src = shows[i].embed + "?autoplay=1";
}

/* ================= ПОЛНОЭКРАННЫЙ РЕЖИМ ================= */
const tvFrame = document.getElementById("tvFrame");
const fsBtn = document.getElementById("fullscreenBtn");

fsBtn.addEventListener("click", () => {
  if (!document.fullscreenElement){
    (tvFrame.requestFullscreen || tvFrame.webkitRequestFullscreen).call(tvFrame);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
});

document.addEventListener("fullscreenchange", updateFsBtn);
document.addEventListener("webkitfullscreenchange", updateFsBtn);
function updateFsBtn(){
  fsBtn.textContent = document.fullscreenElement ? "⤢ Свернуть" : "⛶ На весь экран";
}
</script>
</body>
</html>
